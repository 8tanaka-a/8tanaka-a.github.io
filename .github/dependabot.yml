# 依存関係の自動更新設定
# - security updates は GitHub 側の設定 (Settings > Code security) で有効化する
# - ここでは version updates (定期的なバージョン追随) を定義する
version: 2

updates:
  # npm (pnpm-lock.yaml) の依存
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # PR が一度に増えすぎないよう上限を設ける
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # 関連する更新はまとめて1つの PR にする
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      lint-and-format:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-plugin-*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'astro-eslint-parser'
          - 'prettier'
          - 'prettier-plugin-*'
          - 'husky'
          - 'lint-staged'

  # GitHub Actions 自体のバージョン追随
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
